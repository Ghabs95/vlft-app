<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1116"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Measuring Tape Gradient -->
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Container -->
  <rect width="128" height="128" rx="26" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5"/>

  <!-- Technical Grid Background Lines -->
  <g stroke="#1F2937" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6">
    <line x1="14" y1="96" x2="114" y2="96"/>
    <line x1="56" y1="14" x2="56" y2="96"/>
    <line x1="84" y1="14" x2="84" y2="96"/>
  </g>

  <!-- ===================== ACCURATE ROAD BIKE GEOMETRY ===================== -->
  <g filter="url(#glow)">
    <!-- 700c Road Wheels (Spokes, Rims & Hubs) -->
    <!-- Rear Wheel -->
    <circle cx="32" cy="80" r="16" stroke="#4B5563" stroke-width="2.2" fill="#0B1116" fill-opacity="0.6"/>
    <circle cx="32" cy="80" r="13.5" stroke="#1F2937" stroke-width="0.8" fill="none"/>
    <circle cx="32" cy="80" r="3" fill="#9CA3AF"/>
    
    <!-- Front Wheel -->
    <circle cx="96" cy="80" r="16" stroke="#4B5563" stroke-width="2.2" fill="#0B1116" fill-opacity="0.6"/>
    <circle cx="96" cy="80" r="13.5" stroke="#1F2937" stroke-width="0.8" fill="none"/>
    <circle cx="96" cy="80" r="3" fill="#9CA3AF"/>

    <!-- Slender Carbon Road Frame (Diamond Proportions) -->
    <g stroke="#F3F4F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Chainstay (Rear axle to Bottom Bracket) -->
      <path d="M 32 80 L 56 83"/>
      
      <!-- Seatstay (Rear axle to Seat Cluster) -->
      <path d="M 32 80 L 48 54"/>
      
      <!-- Seat Tube (BB to Seat Cluster at ~74°) -->
      <path d="M 56 83 L 48 54"/>
      
      <!-- Down Tube (BB to Head Tube) -->
      <path d="M 56 83 L 86 51"/>
      
      <!-- Top Tube (Sloping from Head Tube to Seat Cluster) -->
      <path d="M 48 54 L 84 46"/>
      
      <!-- Head Tube -->
      <path d="M 86 51 L 84 45"/>
      
      <!-- Carbon Fork (Headtube to Front Axle) -->
      <path d="M 86 51 L 96 80"/>
      
      <!-- Crank Arm & Pedal at BDC (6 o'clock) -->
      <path d="M 56 83 L 58 89" stroke="#E5B111" stroke-width="2"/>
      <circle cx="56" cy="83" r="3.5" stroke="#E5B111" stroke-width="1.2" fill="#111827"/>
      <circle cx="58" cy="89" r="1.5" fill="#E5B111" stroke="none"/>
    </g>

    <!-- Cockpit & Saddle Details -->
    <!-- Seatpost & Anatomical Saddle -->
    <path d="M 48 54 L 45 46" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 38 45 C 42 44.5 50 44.5 54 46" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Stem & Road Drop Handlebar -->
    <path d="M 84 45 L 90 43" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/> <!-- Stem -->
    <!-- Drop Bar Curve + Hoods -->
    <path d="M 90 43 C 94 43 97 45 95 50 C 94 53 91 54 89 54" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 94 44 L 95 41" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/> <!-- Hoods tip -->

    <!-- ===================== PROPORTIONAL ROAD CYCLIST ===================== -->
    <!-- Aero Helmet & Head (Forward gaze) -->
    <path d="M 76 19 C 83 17 89 21 86 26 C 83 28 76 27 72 24 Z" fill="#FBBF24"/>
    <circle cx="79" cy="24" r="1.5" fill="#0B1116"/> <!-- Eye line -->

    <!-- Spine / Torso (Flat, aerodynamic road posture ~30° angle) -->
    <path d="M 45 43 Q 60 30 75 27" stroke="#F59E0B" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Arm (Shoulder -> Soft Bent Elbow -> Hands on Brake Hoods) -->
    <path d="M 74 28 L 84 37 L 94 44" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Leg at BDC (Hip -> Knee -> Ankle at bottom dead center) -->
    <!-- Knee Extension Angle ~142° (Holmes standard) -->
    <path d="M 45 43 L 56 64 L 58 88" stroke="#F59E0B" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- ===================== BIOMECHANICAL LANDMARKS & ANGLES ===================== -->
    <!-- Joint Nodes -->
    <circle cx="56" cy="64" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="0.8"/> <!-- Knee -->
    <circle cx="45" cy="43" r="2.4" fill="#0284C7" stroke="#FFFFFF" stroke-width="0.8"/> <!-- Hip -->
    <circle cx="74" cy="28" r="2.4" fill="#0284C7" stroke="#FFFFFF" stroke-width="0.8"/> <!-- Shoulder -->
    <circle cx="84" cy="37" r="2" fill="#0284C7"/> <!-- Elbow -->
    <circle cx="58" cy="88" r="2.2" fill="#10B981"/> <!-- Ankle -->

    <!-- Knee Angle Measurement Arc (142° Target) -->
    <path d="M 52 71 A 8 8 0 0 0 58 61" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="1.2 1.2"/>
  </g>

  <!-- ===================== PRECISION MEASURING TAPE ===================== -->
  <g transform="translate(0, 0)">
    <!-- Yellow Measuring Tape Body -->
    <rect x="14" y="98" width="100" height="15" rx="3" fill="url(#tapeGrad)" stroke="#B45309" stroke-width="1"/>
    
    <!-- Millimeter and Centimeter Tick Marks -->
    <path d="
      M 18 98 L 18 107
      M 22 98 L 22 102
      M 26 98 L 26 102
      M 30 98 L 30 102
      M 34 98 L 34 105
      M 38 98 L 38 102
      M 42 98 L 42 102
      M 46 98 L 46 102
      M 50 98 L 50 107
      M 54 98 L 54 102
      M 56 98 L 56 102
      M 60 98 L 60 102
      M 64 98 L 64 109
      M 68 98 L 68 102
      M 72 98 L 72 102
      M 76 98 L 76 102
      M 80 98 L 80 107
      M 84 98 L 84 102
      M 88 98 L 88 102
      M 92 98 L 92 102
      M 96 98 L 96 105
      M 100 98 L 100 102
      M 104 98 L 104 102
      M 108 98 L 108 107
    " stroke="#0B1116" stroke-width="1.3" stroke-linecap="butt"/>

    <!-- Dimension Numbers -->
    <text x="34" y="110" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="800" fill="#0B1116" text-anchor="middle">140</text>
    <text x="64" y="110" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="800" fill="#0B1116" text-anchor="middle">143°</text>
    <text x="96" y="110" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="800" fill="#0B1116" text-anchor="middle">146</text>
  </g>
</svg>
