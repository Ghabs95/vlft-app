<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1116"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Cyclist Gold Gradient -->
    <linearGradient id="cyclistGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Container with Gold Accent Border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#374151" stroke-width="2"/>

  <!-- Centered, Bold & Proportional Road Cyclist -->
  <g filter="url(#glow)" transform="translate(0, 4)">
    <!-- 700c Road Wheels -->
    <circle cx="30" cy="84" r="18" stroke="#4B5563" stroke-width="3" fill="#0B1116" fill-opacity="0.6"/>
    <circle cx="30" cy="84" r="15" stroke="#1F2937" stroke-width="1" fill="none"/>
    <circle cx="30" cy="84" r="4" fill="#9CA3AF"/>
    
    <circle cx="98" cy="84" r="18" stroke="#4B5563" stroke-width="3" fill="#0B1116" fill-opacity="0.6"/>
    <circle cx="98" cy="84" r="15" stroke="#1F2937" stroke-width="1" fill="none"/>
    <circle cx="98" cy="84" r="4" fill="#9CA3AF"/>

    <!-- Slender Road Frame (Diamond Proportions) -->
    <g stroke="#F3F4F6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Chainstay -->
      <path d="M 30 84 L 56 87"/>
      <!-- Seatstay & Seattube -->
      <path d="M 30 84 L 47 54 L 56 87"/>
      <!-- Downtube -->
      <path d="M 56 87 L 88 51"/>
      <!-- Toptube -->
      <path d="M 47 54 L 86 45"/>
      <!-- Fork -->
      <path d="M 88 51 L 98 84"/>
      
      <!-- Seatpost & Saddle -->
      <path d="M 47 54 L 44 44" stroke="#FBBF24" stroke-width="3"/>
      <path d="M 36 43 C 41 42.5 50 42.5 55 44" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Stem & Road Drop Handlebar -->
      <path d="M 86 45 L 93 43" stroke="#FBBF24" stroke-width="3"/>
      <path d="M 93 43 C 98 43 101 45 99 51 C 98 55 94 56 92 56" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M 98 44 L 99 41" stroke="#FBBF24" stroke-width="3"/> <!-- Brake Hood -->
    </g>

    <!-- Crank & Pedal -->
    <path d="M 56 87 L 58 95" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="56" cy="87" r="4" stroke="#FBBF24" stroke-width="1.5" fill="#111827"/>
    <circle cx="58" cy="95" r="2" fill="#FBBF24"/>

    <!-- ===================== PROPORTIONAL AERO CYCLIST ===================== -->
    <!-- Aero Helmet & Head (Forward gaze) -->
    <path d="M 76 15 C 84 13 91 17 88 23 C 85 26 77 25 72 21 Z" fill="#FBBF24"/>
    <circle cx="80" cy="21" r="1.8" fill="#0B1116"/>

    <!-- Spine / Torso (Aero Flat Road Back ~30°) -->
    <path d="M 44 41 Q 60 26 76 23" stroke="url(#cyclistGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Arm (Shoulder -> Soft Bent Elbow -> Hands on Brake Hoods) -->
    <path d="M 75 24 L 86 34 L 98 44" stroke="#FBBF24" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Leg at BDC (Hip -> Knee -> Ankle at bottom dead center) -->
    <path d="M 44 41 L 56 66 L 58 94" stroke="url(#cyclistGold)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- ===================== BIOMECHANICAL LANDMARKS & ANGLES ===================== -->
    <!-- Joint Landmark Nodes -->
    <circle cx="56" cy="66" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1"/> <!-- Knee -->
    <circle cx="44" cy="41" r="3" fill="#0284C7" stroke="#FFFFFF" stroke-width="1"/> <!-- Hip -->
    <circle cx="75" cy="24" r="3" fill="#0284C7" stroke="#FFFFFF" stroke-width="1"/> <!-- Shoulder -->
    <circle cx="86" cy="34" r="2.5" fill="#0284C7"/> <!-- Elbow -->
    <circle cx="58" cy="94" r="2.5" fill="#10B981"/> <!-- Ankle -->

    <!-- Target Knee Angle Arc (143° Holmes Indicator) -->
    <path d="M 51 74 A 9 9 0 0 0 59 63" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="1.5 1.5"/>
  </g>
</svg>
