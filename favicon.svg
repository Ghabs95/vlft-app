<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1116"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Measuring Tape Gold Gradient -->
    <linearGradient id="tapeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Container with Gold Border Accent -->
  <rect width="128" height="128" rx="26" fill="url(#bg)" stroke="#374151" stroke-width="2"/>
  
  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#1F2937" stroke-width="1" stroke-dasharray="2 3" opacity="0.6">
    <line x1="16" y1="84" x2="112" y2="84"/>
    <line x1="64" y1="16" x2="64" y2="100"/>
  </g>

  <!-- ===================== ROAD BIKE & CYCLIST ===================== -->
  <g filter="url(#glow)">
    <!-- Road Bike Wheels with Spoke Texture -->
    <circle cx="32" cy="78" r="16" stroke="#4B5563" stroke-width="2.5" fill="#0B1116" fill-opacity="0.5"/>
    <circle cx="32" cy="78" r="3.5" fill="#9CA3AF"/>
    
    <circle cx="96" cy="78" r="16" stroke="#4B5563" stroke-width="2.5" fill="#0B1116" fill-opacity="0.5"/>
    <circle cx="96" cy="78" r="3.5" fill="#9CA3AF"/>

    <!-- Road Diamond Frame (Pure Precision Geometry) -->
    <g stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Chainstay -->
      <path d="M 32 78 L 56 78"/>
      <!-- Seatstay & Seattube -->
      <path d="M 32 78 L 47 44 L 56 78"/>
      <!-- Downtube -->
      <path d="M 56 78 L 83 40"/>
      <!-- Toptube -->
      <path d="M 47 44 L 83 40"/>
      <!-- Fork to Front Wheel -->
      <path d="M 83 40 L 96 78"/>
      
      <!-- Seatpost & Saddle -->
      <path d="M 47 44 L 45 35 M 39 34 L 51 34" stroke="#FBBF24" stroke-width="2.8"/>
      
      <!-- Stem & Road Drop Handlebar -->
      <path d="M 83 40 L 87 34 L 93 36 L 91 44" stroke="#FBBF24" stroke-width="2.8"/>
    </g>

    <!-- Cyclist in Aerodynamic Road Position -->
    <!-- Helmet & Visor -->
    <path d="M 71 18 C 77 15 84 19 82 23 C 80 26 73 25 69 23 Z" fill="#FBBF24"/>
    
    <!-- Torso (Aero flat back angle) -->
    <path d="M 45 34 L 58 24 L 71 22" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Arm (Slight elbow flexion to hoods) -->
    <path d="M 69 24 L 81 30 L 91 36" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Leg at BDC (Hip -> Knee -> Ankle at bottom dead center 6 o'clock) -->
    <path d="M 45 34 L 54 56 L 56 78" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Biomechanical Landmark Laser Nodes -->
    <circle cx="54" cy="56" r="3" fill="#10B981" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="69" cy="24" r="2.5" fill="#0284C7" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="81" cy="30" r="2" fill="#0284C7"/>
    <circle cx="56" cy="78" r="2.5" fill="#10B981" stroke="#FFFFFF" stroke-width="0.8"/>

    <!-- Knee Angle Extension Arc (143° Holmes Indicator) -->
    <path d="M 50 63 A 8 8 0 0 0 57 53" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="1.5 1.5"/>
  </g>

  <!-- ===================== MEASURING TAPE STRIP ===================== -->
  <!-- Yellow Measuring Tape with Millimeter & Centimeter Graduations -->
  <g transform="translate(0, 2)">
    <!-- Tape body -->
    <rect x="12" y="100" width="104" height="15" rx="3" fill="url(#tapeGold)" stroke="#B45309" stroke-width="1"/>
    
    <!-- Tape Tick Marks (Centimeters & Millimeters) -->
    <path d="
      M 16 100 L 16 110
      M 20 100 L 20 105
      M 24 100 L 24 105
      M 28 100 L 28 105
      M 32 100 L 32 108
      M 36 100 L 36 105
      M 40 100 L 40 105
      M 44 100 L 44 105
      M 48 100 L 48 110
      M 52 100 L 52 105
      M 56 100 L 56 105
      M 60 100 L 60 105
      M 64 100 L 64 112
      M 68 100 L 68 105
      M 72 100 L 72 105
      M 76 100 L 76 105
      M 80 100 L 80 110
      M 84 100 L 84 105
      M 88 100 L 88 105
      M 92 100 L 92 105
      M 96 100 L 96 108
      M 100 100 L 100 105
      M 104 100 L 104 105
      M 108 100 L 108 105
      M 112 100 L 112 110
    " stroke="#0B1116" stroke-width="1.4" stroke-linecap="butt"/>

    <!-- Small Tape Measure Numbers -->
    <text x="32" y="113" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" fill="#0B1116" text-anchor="middle">14</text>
    <text x="64" y="113" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" fill="#0B1116" text-anchor="middle">15</text>
    <text x="96" y="113" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" fill="#0B1116" text-anchor="middle">16</text>
  </g>
</svg>
