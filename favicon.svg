<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="100" height="100" rx="22" fill="url(#grad)" />
  
  <!-- Stylized Minimalist Cyclist & Bike Silhouette -->
  <g filter="url(#shadow)" fill="none" stroke="#0B1116" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="27" cy="69" r="14" stroke-width="5"/>
    <circle cx="73" cy="69" r="14" stroke-width="5"/>
    
    <!-- Bike Frame Geometry -->
    <path d="M27 69 L48 69 L63 46 L73 69" stroke-width="5"/>
    <path d="M48 69 L57 46 L40 46 L27 69" stroke-width="5"/>
    <path d="M57 46 L55 38 M49 37 L61 37" stroke-width="4.5"/>
    <path d="M63 46 L66 38 L72 40" stroke-width="4.5"/>
    
    <!-- Rider -->
    <circle cx="56" cy="22" r="6" fill="#0B1116" stroke="none"/>
    <path d="M56 26 L55 36 L48 48" stroke-width="5"/>
    <path d="M55 30 L66 38" stroke-width="4.5"/>
    <path d="M48 48 L49 60 L48 69" stroke-width="4.5"/>
  </g>
</svg>
