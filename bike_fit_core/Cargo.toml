[package]
name = "bike_fit_core"
version = "0.1.0"
edition = "2021"
authors = ["Bike Fit Pro Team"]
description = "Deterministic Biomechanical and Geometry Fitting Engine in WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
